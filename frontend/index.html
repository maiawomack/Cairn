<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cairn</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"
        integrity="sha384-yFNc3bs28S14jOJo1ZO9SnLiAmtyY2a3H9be8GkLMpDGlO5r1zZNP8fYu+fOCE/w" crossorigin="anonymous">
  <script type="importmap">
    {
      "imports": { "maplibre-gl": "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs" },
      "integrity": {
        "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs": "sha384-tG0qQdL7veKvVoyu6PbnmddDls/OVkTjaK9oVY5eq9afBA6zYptFui69Dx57duAh"
      }
    }
  </script>
  <style>
    :root {
      --paper: #f3ede0;
      --slate: #3b4250;
      --hazard: #b23a3a;
      --route: #5b3f8c;
      --contour: #9a7b5a;
    }
    html, body, #map { height: 100%; margin: 0; background: var(--paper); }
    body { font-family: Georgia, "Iowan Old Style", serif; color: var(--slate); }

    .layer-toggle {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: rgba(243, 237, 224, 0.9); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; line-height: 1.7;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    .layer-toggle label { display: block; cursor: pointer; }
    .layer-toggle .replay { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(59, 66, 80, 0.2); }
    .layer-toggle button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 1px 6px;
    }
    .layer-toggle button.playing { border-color: var(--route); color: var(--route); }
    .layer-toggle .replay-speed { margin-top: 4px; }
    .playback-speed { font-size: 11px; color: var(--hazard); margin-left: 4px; }
    .ignored-tag {
      pointer-events: none; padding: 2px 6px; border-radius: 3px; font-size: 11px;
      background: rgba(243, 237, 224, 0.95); color: var(--hazard); border: 1px solid var(--hazard);
    }
    .target-label {
      pointer-events: none; padding: 3px 8px; border-radius: 4px; max-width: 220px;
      background: rgba(178, 58, 58, 0.92); color: #fff; font-size: 13px; font-style: italic;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .spankys-marker { display: flex; align-items: center; gap: 6px; pointer-events: none; }
    .spankys-marker .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--paper); border: 3px solid var(--hazard);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
    }
    .spankys-marker .label {
      font-size: 14px; font-style: italic; color: var(--slate);
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
    }

    /* The exact words being spoken, over the map. Loud only for warnings. */
    .spoken-banner {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 2;
      max-width: min(640px, calc(100% - 32px)); padding: 12px 22px; border-radius: 8px;
      font-size: 22px; line-height: 1.35; text-align: center;
      background: rgba(243, 237, 224, 0.96); color: var(--slate);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25); border-left: 6px solid var(--route);
      transition: opacity 0.6s;
    }
    .spoken-banner.warning { background: var(--hazard); color: #fff; border-left-color: #7d1f1f; }
    .spoken-banner.guidance { border-left-color: var(--hazard); }
    .spoken-banner.fading { opacity: 0; }
    .spoken-banner small { display: block; font-size: 12px; opacity: 0.8; margin-top: 4px; }

    .agents-panel {
      position: absolute; top: 12px; right: 56px; z-index: 1; width: 290px;
      background: rgba(243, 237, 224, 0.92); border-radius: 6px; padding: 10px 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); font-size: 13px;
    }
    .agents-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .agents-panel button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 2px 8px;
    }
    .agents-panel button:disabled { opacity: 0.5; cursor: default; }
    /* Org chart: a field notebook card on the map, contour brown lines, purple when an agent runs. */
    .org-card {
      position: absolute; left: 12px; bottom: 34px; z-index: 1; width: 400px;
      background: rgba(243, 237, 224, 0.95); border: 1px solid var(--contour); border-radius: 6px;
      padding: 10px 14px 12px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
    }
    .org-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .org-header h2 { margin: 0; font-size: 15px; font-weight: normal; font-style: italic; letter-spacing: 0.02em; }
    .org-header button, .agent-output button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 2px 8px;
    }
    .org-header button:disabled { opacity: 0.5; cursor: default; }
    .org-chart { display: flex; flex-direction: column; align-items: center; }
    .org-body { display: flex; gap: 14px; align-items: flex-start; margin-top: 4px; position: relative; padding-top: 12px; }
    /* Lines from Maia down to the chain, and dashed across to the Incident Responder. */
    .org-body::before {
      content: ""; position: absolute; top: 0; left: 50%; height: 12px; border-left: 1px solid var(--contour);
    }
    .org-body::after {
      content: ""; position: absolute; top: 0; left: 82px; right: 70px; border-top: 1px solid var(--contour);
    }
    .org-chain { display: flex; flex-direction: column; align-items: center; width: 190px; }
    .org-side { padding-top: 0; width: 170px; border-top: 1px dashed transparent; }
    .org-arrow { color: var(--contour); font-size: 13px; line-height: 16px; }
    .org-box {
      display: grid; grid-template-columns: 12px 1fr; column-gap: 6px; text-align: left; width: 100%;
      font: inherit; color: var(--slate); background: #faf6ec; cursor: pointer;
      border: 1px solid var(--contour); border-radius: 4px; padding: 5px 8px;
      transition: box-shadow 0.3s, border-color 0.3s, background 0.3s;
    }
    .org-box b { font-weight: normal; font-size: 13.5px; }
    .org-box .org-role { grid-column: 2; font-size: 11px; font-style: italic; color: rgba(59, 66, 80, 0.75); }
    .org-box .org-run { grid-column: 2; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: rgba(59, 66, 80, 0.8); }
    .org-box .org-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--contour); opacity: 0.5; }
    .org-box:hover { border-color: var(--slate); }
    .org-box.founder { display: block; width: auto; text-align: center; cursor: default; padding: 4px 18px; }
    .org-box.founder b { font-size: 14px; }
    .org-box.founder .org-role { display: block; }
    .org-box.standby { border-style: dashed; }
    .org-box.done .org-dot { background: #4f7d4c; opacity: 1; }
    .org-box.failed { border-color: var(--hazard); }
    .org-box.failed .org-dot { background: var(--hazard); opacity: 1; }
    .org-box.running { border-color: var(--route); background: #f1ecf6; animation: org-glow 1.4s ease-in-out infinite; }
    .org-box.running .org-dot { background: var(--route); opacity: 1; }
    @keyframes org-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(91, 63, 140, 0.0); }
      50% { box-shadow: 0 0 0 4px rgba(91, 63, 140, 0.22); }
    }
    .agent-output {
      width: min(560px, calc(100% - 32px)); max-height: 70vh; border: 1px solid var(--contour); border-radius: 6px;
      background: var(--paper); color: var(--slate); padding: 12px 16px; font-family: Georgia, serif;
    }
    .agent-output::backdrop { background: rgba(59, 66, 80, 0.25); }
    .agent-output header { display: flex; justify-content: space-between; align-items: baseline; }
    .agent-output h3 { margin: 0; font-weight: normal; font-style: italic; }
    .agent-output-meta { margin: 4px 0 8px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: rgba(59, 66, 80, 0.8); }
    .agent-output pre {
      margin: 0; max-height: 52vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.45;
      background: #faf6ec; border: 1px solid rgba(124, 92, 62, 0.35); border-radius: 4px; padding: 8px 10px;
    }
    .conditions { border-top: 1px solid rgba(59, 66, 80, 0.2); padding-top: 6px; line-height: 1.5; }
    .agent-log {
      list-style: none; margin: 6px 0 0; padding: 6px 0 0; max-height: 160px; overflow-y: auto;
      border-top: 1px solid rgba(59, 66, 80, 0.2);
      font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.5;
    }
    .agent-log time { color: rgba(59, 66, 80, 0.6); margin-right: 4px; }

    .maplibregl-popup.hover-label .maplibregl-popup-content {
      padding: 3px 8px; font-family: Georgia, serif; font-size: 13px;
      background: rgba(243, 237, 224, 0.95); color: var(--slate);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="spoken-banner" class="spoken-banner" hidden></div>
  <div class="layer-toggle">
    <label><input type="checkbox" data-group="runs" checked> Runs</label>
    <label><input type="checkbox" data-group="lifts"> Lifts</label>
    <label><input type="checkbox" data-group="hazards" checked> Hazards</label>
    <label><input type="checkbox" data-group="exits"> Safe exits (proposed)</label>
    <div class="replay">
      Replay
      <button type="button" data-scenario="scenario_1">Scenario 1</button>
      <button type="button" data-scenario="scenario_2">Scenario 2</button>
    </div>
    <div class="replay-speed">
      Speed
      <button type="button" data-speed="1" class="playing">1x</button>
      <button type="button" data-speed="2">2x</button>
      <button type="button" data-speed="4">4x</button>
      <span id="playback-speed" class="playback-speed"></span>
    </div>
  </div>
  <div class="agents-panel">
    <div class="agents-header"><span>Today on the mountain</span></div>
    <div id="conditions" class="conditions"></div>
    <ul id="agent-log" class="agent-log"></ul>
  </div>

  <!-- Agent org chart: Maia founds it, the Creao chain runs top to bottom, Incident Responder
       stands by off to the side. Boxes light up while their agent runs; click for the last output. -->
  <section class="org-card" aria-label="Cairn agent org chart">
    <header class="org-header">
      <h2>The Cairn crew</h2>
      <button type="button" id="run-agents">Run agents</button>
    </header>
    <div class="org-chart">
      <div class="org-box founder"><b>Maia</b><span class="org-role">founder</span></div>
      <div class="org-body">
        <div class="org-chain">
          <button type="button" class="org-box" data-role="conditions"><span class="org-dot"></span><b>Conditions Analyst</b><span class="org-role">weather, avalanche, closures</span><span class="org-run"></span></button>
          <div class="org-arrow">↓</div>
          <button type="button" class="org-box" data-role="terrain"><span class="org-dot"></span><b>Terrain Scout</b><span class="org-role">today's zones and briefings</span><span class="org-run"></span></button>
          <div class="org-arrow">↓</div>
          <button type="button" class="org-box" data-role="route"><span class="org-dot"></span><b>Route Planner</b><span class="org-role">lines through each bowl</span><span class="org-run"></span></button>
        </div>
        <div class="org-side">
          <button type="button" class="org-box standby" data-role="incident"><span class="org-dot"></span><b>Incident Responder</b><span class="org-role">on standby for patrol</span><span class="org-run"></span></button>
        </div>
      </div>
    </div>
  </section>

  <dialog id="agent-output" class="agent-output">
    <header><h3 id="agent-output-title"></h3><button type="button" id="agent-output-close" aria-label="Close">×</button></header>
    <p id="agent-output-meta" class="agent-output-meta"></p>
    <pre id="agent-output-body"></pre>
  </dialog>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
