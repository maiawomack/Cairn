<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cairn</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"
        integrity="sha384-yFNc3bs28S14jOJo1ZO9SnLiAmtyY2a3H9be8GkLMpDGlO5r1zZNP8fYu+fOCE/w" crossorigin="anonymous">
  <script type="importmap">
    {
      "imports": { "maplibre-gl": "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs" },
      "integrity": {
        "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs": "sha384-tG0qQdL7veKvVoyu6PbnmddDls/OVkTjaK9oVY5eq9afBA6zYptFui69Dx57duAh"
      }
    }
  </script>
  <style>
    :root {
      --paper: #f3ede0;
      --slate: #3b4250;
      --hazard: #b23a3a;
      --route: #5b3f8c;
    }
    html, body, #map { height: 100%; margin: 0; background: var(--paper); }
    body { font-family: Georgia, "Iowan Old Style", serif; color: var(--slate); }

    .layer-toggle {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: rgba(243, 237, 224, 0.9); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; line-height: 1.7;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    .layer-toggle label { display: block; cursor: pointer; }
    .layer-toggle .replay { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(59, 66, 80, 0.2); }
    .layer-toggle button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 1px 6px;
    }
    .layer-toggle button.playing { border-color: var(--route); color: var(--route); }

    .spankys-marker { display: flex; align-items: center; gap: 6px; pointer-events: none; }
    .spankys-marker .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--paper); border: 3px solid var(--hazard);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
    }
    .spankys-marker .label {
      font-size: 14px; font-style: italic; color: var(--slate);
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
    }

    .maplibregl-popup.hover-label .maplibregl-popup-content {
      padding: 3px 8px; font-family: Georgia, serif; font-size: 13px;
      background: rgba(243, 237, 224, 0.95); color: var(--slate);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="layer-toggle">
    <label><input type="checkbox" data-group="runs" checked> Runs</label>
    <label><input type="checkbox" data-group="lifts"> Lifts</label>
    <label><input type="checkbox" data-group="hazards" checked> Hazards</label>
    <label><input type="checkbox" data-group="exits"> Safe exits (proposed)</label>
    <div class="replay">
      Replay
      <button type="button" data-scenario="scenario_1">Scenario 1</button>
      <button type="button" data-scenario="scenario_2">Scenario 2</button>
    </div>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
