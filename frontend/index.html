<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cairn</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"
        integrity="sha384-yFNc3bs28S14jOJo1ZO9SnLiAmtyY2a3H9be8GkLMpDGlO5r1zZNP8fYu+fOCE/w" crossorigin="anonymous">
  <script type="importmap">
    {
      "imports": { "maplibre-gl": "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs" },
      "integrity": {
        "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs": "sha384-tG0qQdL7veKvVoyu6PbnmddDls/OVkTjaK9oVY5eq9afBA6zYptFui69Dx57duAh"
      }
    }
  </script>
  <style>
    :root {
      --paper: #f3ede0;
      --slate: #3b4250;
      --hazard: #b23a3a;
      --route: #5b3f8c;
    }
    html, body, #map { height: 100%; margin: 0; background: var(--paper); }
    body { font-family: Georgia, "Iowan Old Style", serif; color: var(--slate); }

    .layer-toggle {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: rgba(243, 237, 224, 0.9); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; line-height: 1.7;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    .layer-toggle label { display: block; cursor: pointer; }
    .layer-toggle .replay { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(59, 66, 80, 0.2); }
    .layer-toggle button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 1px 6px;
    }
    .layer-toggle button.playing { border-color: var(--route); color: var(--route); }
    .layer-toggle .replay-speed { margin-top: 4px; }
    .playback-speed { font-size: 11px; color: var(--hazard); margin-left: 4px; }
    .target-label {
      pointer-events: none; padding: 3px 8px; border-radius: 4px; max-width: 220px;
      background: rgba(178, 58, 58, 0.92); color: #fff; font-size: 13px; font-style: italic;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .spankys-marker { display: flex; align-items: center; gap: 6px; pointer-events: none; }
    .spankys-marker .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--paper); border: 3px solid var(--hazard);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
    }
    .spankys-marker .label {
      font-size: 14px; font-style: italic; color: var(--slate);
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
    }

    /* The exact words being spoken, over the map. Loud only for warnings. */
    .spoken-banner {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 2;
      max-width: min(640px, calc(100% - 32px)); padding: 12px 22px; border-radius: 8px;
      font-size: 22px; line-height: 1.35; text-align: center;
      background: rgba(243, 237, 224, 0.96); color: var(--slate);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25); border-left: 6px solid var(--route);
      transition: opacity 0.6s;
    }
    .spoken-banner.warning { background: var(--hazard); color: #fff; border-left-color: #7d1f1f; }
    .spoken-banner.guidance { border-left-color: var(--hazard); }
    .spoken-banner.fading { opacity: 0; }
    .spoken-banner small { display: block; font-size: 12px; opacity: 0.8; margin-top: 4px; }

    .agents-panel {
      position: absolute; top: 12px; right: 56px; z-index: 1; width: 290px;
      background: rgba(243, 237, 224, 0.92); border-radius: 6px; padding: 10px 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); font-size: 13px;
    }
    .agents-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .agents-panel button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 2px 8px;
    }
    .agents-panel button:disabled { opacity: 0.5; cursor: default; }
    .org-chart { list-style: none; margin: 8px 0; padding: 0; }
    .org-chart li {
      margin: 3px 0 3px 14px; padding: 3px 8px; border-left: 3px solid rgba(59, 66, 80, 0.25);
      display: flex; justify-content: space-between; transition: background 0.3s, border-color 0.3s;
    }
    .org-chart li.founder { margin-left: 0; font-weight: bold; }
    .org-chart li small { color: rgba(59, 66, 80, 0.7); font-family: ui-monospace, Menlo, monospace; }
    .org-chart li.running { border-color: var(--route); background: rgba(91, 63, 140, 0.12); }
    .org-chart li.done { border-color: #4f7d4c; }
    .org-chart li.failed { border-color: var(--hazard); background: rgba(178, 58, 58, 0.1); }
    .conditions { border-top: 1px solid rgba(59, 66, 80, 0.2); padding-top: 6px; line-height: 1.5; }
    .agent-log {
      list-style: none; margin: 6px 0 0; padding: 6px 0 0; max-height: 160px; overflow-y: auto;
      border-top: 1px solid rgba(59, 66, 80, 0.2);
      font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.5;
    }
    .agent-log time { color: rgba(59, 66, 80, 0.6); margin-right: 4px; }

    .maplibregl-popup.hover-label .maplibregl-popup-content {
      padding: 3px 8px; font-family: Georgia, serif; font-size: 13px;
      background: rgba(243, 237, 224, 0.95); color: var(--slate);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="spoken-banner" class="spoken-banner" hidden></div>
  <div class="layer-toggle">
    <label><input type="checkbox" data-group="runs" checked> Runs</label>
    <label><input type="checkbox" data-group="lifts"> Lifts</label>
    <label><input type="checkbox" data-group="hazards" checked> Hazards</label>
    <label><input type="checkbox" data-group="exits"> Safe exits (proposed)</label>
    <div class="replay">
      Replay
      <button type="button" data-scenario="scenario_1">Scenario 1</button>
      <button type="button" data-scenario="scenario_2">Scenario 2</button>
    </div>
    <div class="replay-speed">
      Speed
      <button type="button" data-speed="1" class="playing">1x</button>
      <button type="button" data-speed="2">2x</button>
      <button type="button" data-speed="4">4x</button>
      <span id="playback-speed" class="playback-speed"></span>
    </div>
  </div>
  <div class="agents-panel">
    <div class="agents-header">
      <span>Creao agents</span>
      <button type="button" id="run-agents">Run agents</button>
    </div>
    <ol class="org-chart">
      <li class="founder">Maia <small>founder</small></li>
      <li data-role="conditions">Conditions Analyst <small></small></li>
      <li data-role="terrain">Terrain Scout <small></small></li>
      <li data-role="route">Route Planner <small></small></li>
      <li data-role="incident">Incident Responder <small></small></li>
    </ol>
    <div id="conditions" class="conditions"></div>
    <ul id="agent-log" class="agent-log"></ul>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
