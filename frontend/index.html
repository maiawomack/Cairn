<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cairn</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.css"
        integrity="sha384-yFNc3bs28S14jOJo1ZO9SnLiAmtyY2a3H9be8GkLMpDGlO5r1zZNP8fYu+fOCE/w" crossorigin="anonymous">
  <script type="importmap">
    {
      "imports": { "maplibre-gl": "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs" },
      "integrity": {
        "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs": "sha384-tG0qQdL7veKvVoyu6PbnmddDls/OVkTjaK9oVY5eq9afBA6zYptFui69Dx57duAh"
      }
    }
  </script>
  <style>
    :root {
      --paper: #f3ede0;
      --slate: #3b4250;
      --hazard: #b23a3a;
      --route: #5b3f8c;
      --contour: #9a7b5a;
      --code: #3f7f78; /* muted teal for our code */
    }
    html, body, #map { height: 100%; margin: 0; background: var(--paper); }
    body { font-family: Georgia, "Iowan Old Style", serif; color: var(--slate); }

    .layer-toggle {
      position: absolute; top: 12px; left: 12px; z-index: 1;
      background: rgba(243, 237, 224, 0.9); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; line-height: 1.7;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    .layer-toggle label { display: block; cursor: pointer; }
    .layer-toggle .replay { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(59, 66, 80, 0.2); }
    .layer-toggle button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 1px 6px;
    }
    .layer-toggle button.playing { border-color: var(--route); color: var(--route); }
    .layer-toggle .replay-speed, .layer-toggle .view-toggle { margin-top: 4px; }
    .layer-toggle .replay { max-width: 260px; }
    .layer-toggle .replay button { margin: 0 2px 3px 0; }
    .playback-speed { font-size: 11px; color: var(--hazard); margin-left: 4px; }
    .ignored-tag {
      pointer-events: none; padding: 2px 6px; border-radius: 3px; font-size: 11px;
      background: rgba(243, 237, 224, 0.95); color: var(--hazard); border: 1px solid var(--hazard);
    }
    .target-label {
      pointer-events: none; padding: 3px 8px; border-radius: 4px; max-width: 220px;
      background: rgba(178, 58, 58, 0.92); color: #fff; font-size: 13px; font-style: italic;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .spankys-marker { display: flex; align-items: center; gap: 6px; pointer-events: none; }
    .spankys-marker .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--paper); border: 3px solid var(--hazard);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
    }
    .spankys-marker .label {
      font-size: 14px; font-style: italic; color: var(--slate);
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
    }

    /* The exact words being spoken, over the map. Loud only for warnings. */
    .spoken-banner {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 2;
      max-width: min(640px, calc(100% - 32px)); padding: 12px 22px; border-radius: 8px;
      font-size: 22px; line-height: 1.35; text-align: center;
      background: rgba(243, 237, 224, 0.96); color: var(--slate);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25); border-left: 6px solid var(--route);
      transition: opacity 0.6s;
    }
    .spoken-banner.warning { background: var(--hazard); color: #fff; border-left-color: #7d1f1f; }
    .spoken-banner.guidance { border-left-color: var(--hazard); }
    .spoken-banner.fading { opacity: 0; }
    .spoken-banner small { display: block; font-size: 12px; opacity: 0.8; margin-top: 4px; }

    .agents-panel {
      position: absolute; top: 12px; right: 56px; z-index: 1; width: 290px;
      background: rgba(243, 237, 224, 0.92); border-radius: 6px; padding: 10px 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); font-size: 13px;
    }
    .agents-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .agents-panel button {
      font: inherit; font-size: 12px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 2px 8px;
    }
    .agents-panel button:disabled { opacity: 0.5; cursor: default; }
    /* Org chart: a field notebook card on the map. Creao agents purple, our code muted teal; a box that
       is working gets a thicker border and a pulse, so the cue is not the color alone. */
    .org-card {
      position: absolute; left: 12px; bottom: 34px; z-index: 1; width: 622px; max-width: calc(100% - 24px);
      background: rgba(243, 237, 224, 0.95); border: 1px solid var(--contour); border-radius: 6px;
      padding: 10px 14px 12px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
    }
    .org-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .org-card.collapsed .org-header { margin-bottom: 0; }
    .org-card.collapsed #org-content { display: none; }
    .org-header h2 { margin: 0; font-size: 16px; font-weight: normal; font-style: italic; letter-spacing: 0.02em; }
    .org-header-buttons { display: flex; gap: 6px; }
    .org-header button, .agent-output button {
      font: inherit; font-size: 13px; color: var(--slate); cursor: pointer;
      background: transparent; border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 2px 8px;
    }
    .org-header button:disabled { opacity: 0.5; cursor: default; }
    .org-chart { display: flex; flex-direction: column; align-items: center; }
    .org-body { display: flex; gap: 14px; align-items: flex-start; margin-top: 4px; position: relative; padding-top: 12px; }
    /* A stem from Maia, a bar across to the middle of the outer columns, and a drop into each column. */
    .org-body::before {
      content: ""; position: absolute; top: 0; left: 50%; height: 12px; border-left: 1px solid var(--contour);
    }
    .org-body::after {
      content: ""; position: absolute; top: 0; left: 100px; right: 100px; border-top: 1px solid var(--contour);
    }
    .org-col { position: relative; }
    .org-col::before {
      content: ""; position: absolute; top: -12px; left: 50%; height: 12px; border-left: 1px solid var(--contour);
    }
    .org-side::before { border-left-style: dashed; }
    .org-chain { display: flex; flex-direction: column; align-items: center; width: 200px; }
    .org-side { width: 150px; }
    .org-arrow { color: var(--contour); font-size: 14px; line-height: 16px; }
    .org-box {
      --box: var(--contour);
      display: grid; grid-template-columns: 12px 1fr; column-gap: 6px; text-align: left; width: 100%;
      font: inherit; color: var(--slate); background: #faf6ec; cursor: pointer;
      border: 1.5px solid var(--box); border-radius: 4px; padding: 5px 8px;
      transition: box-shadow 0.3s, background 0.3s;
    }
    .org-box.creao { --box: var(--route); }
    .org-box.code { --box: var(--code); }
    .org-box b { font-weight: normal; font-size: 14.5px; }
    .org-box .org-role { grid-column: 2; font-size: 12.5px; font-style: italic; color: rgba(59, 66, 80, 0.8); }
    .org-box .org-run { grid-column: 2; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: rgba(59, 66, 80, 0.9); overflow-wrap: anywhere; }
    .org-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--box, var(--contour)); }
    .org-box:hover { background: #fffaf0; }
    .org-box.founder { --box: var(--contour); display: block; width: auto; text-align: center; cursor: default; padding: 4px 18px; }
    .org-box.founder b { font-size: 15px; }
    .org-box.founder .org-role { display: block; }
    .org-box.founder .org-dot { display: none; }
    .org-box.standby { border-style: dashed; }
    .org-box.failed { border-color: var(--hazard); }
    .org-box.failed .org-dot { background: var(--hazard); }
    /* Working: a border twice as thick (padding gives back the difference so nothing shifts), a tint, a pulse. */
    .org-box.running {
      border-width: 3px; padding: 3.5px 6.5px;
      background: color-mix(in srgb, var(--box) 10%, #faf6ec);
      animation: org-pulse 1.2s ease-in-out infinite;
    }
    @keyframes org-pulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--box) 0%, transparent); }
      50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--box) 28%, transparent); }
    }
    .org-legend { margin: 8px 0 0; font-size: 12px; color: rgba(59, 66, 80, 0.85); text-align: center; }
    .org-legend .org-dot { display: inline-block; margin: 0 3px 0 10px; }
    .creao-dot { background: var(--route); }
    .code-dot { background: var(--code); }
    /* Crash check-in ring, bottom right. */
    .checkin {
      position: absolute; right: 16px; bottom: 44px; z-index: 2; width: 210px; text-align: center;
      background: rgba(243, 237, 224, 0.96); border: 1px solid var(--contour); border-radius: 8px;
      padding: 12px 12px 14px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }
    .checkin-ring { width: 150px; height: 150px; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: rgba(59, 66, 80, 0.15); stroke-width: 10; }
    .ring-fill { fill: none; stroke: var(--route); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 0; }
    .checkin.urgent .ring-fill { stroke: var(--hazard); }
    .checkin-count { position: absolute; top: 48px; left: 0; right: 0; font-size: 54px; line-height: 1; font-family: Georgia, serif; }
    .checkin-title { margin: 4px 0 8px; font-size: 17px; font-style: italic; }
    .checkin-buttons { display: flex; flex-direction: column; gap: 5px; }
    .checkin-buttons button {
      font: inherit; font-size: 14px; color: var(--slate); cursor: pointer; background: #faf6ec;
      border: 1px solid rgba(59, 66, 80, 0.4); border-radius: 4px; padding: 5px 8px;
    }
    .checkin-buttons button:hover { background: #fffaf0; }
    .checkin.done .checkin-buttons { display: none; }

    /* Patrol view: replaces the side panel and the org card. */
    .patrol-panel {
      display: none; position: absolute; right: 12px; top: 12px; bottom: 44px; width: 380px; z-index: 1; overflow-y: auto;
      background: rgba(243, 237, 224, 0.96); border: 1px solid var(--contour); border-radius: 6px; padding: 10px 14px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
    }
    body.patrol .patrol-panel { display: block; }
    body.patrol .org-card, body.patrol .agents-panel { display: none; }
    .patrol-panel h2 { margin: 0; font-size: 18px; font-weight: normal; font-style: italic; }
    .patrol-panel .simulated { margin: 4px 0 8px; padding: 3px 8px; font-size: 13px; color: #fff; background: var(--hazard); border-radius: 3px; display: inline-block; }
    .patrol-panel header button {
      display: block; font: inherit; font-size: 12.5px; color: var(--slate); cursor: pointer; background: transparent;
      border: 1px solid rgba(59, 66, 80, 0.35); border-radius: 4px; padding: 2px 8px; margin-bottom: 8px;
    }
    .patrol-empty { font-style: italic; color: rgba(59, 66, 80, 0.8); }
    .incident-card { background: #faf6ec; border: 1px solid var(--contour); border-left-width: 6px; border-radius: 4px; padding: 8px 10px; margin-bottom: 10px; font-size: 14px; line-height: 1.45; }
    .incident-card.escalated { border-left-color: var(--hazard); }
    .incident-card header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .incident-card .chip { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .incident-card dl { margin: 6px 0 0; display: grid; grid-template-columns: 80px 1fr; gap: 2px 8px; }
    .incident-card dt { color: rgba(59, 66, 80, 0.75); }
    .incident-card dd { margin: 0; }
    .incident-card pre { margin: 6px 0 0; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: #f3ede0; padding: 6px 8px; border-radius: 3px; }
    .incident-card .source { font-size: 12px; font-style: italic; color: rgba(59, 66, 80, 0.75); margin-top: 3px; }
    .incident-pin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--route); background: var(--route); }
    body.patrol .incident-pin { display: block; }
    .incident-pin.escalated { background: var(--hazard); box-shadow: 0 0 0 2px var(--hazard); }

    .agent-output {
      width: min(560px, calc(100% - 32px)); max-height: 70vh; border: 1px solid var(--contour); border-radius: 6px;
      background: var(--paper); color: var(--slate); padding: 12px 16px; font-family: Georgia, serif;
    }
    .agent-output::backdrop { background: rgba(59, 66, 80, 0.25); }
    .agent-output header { display: flex; justify-content: space-between; align-items: baseline; }
    .agent-output h3 { margin: 0; font-weight: normal; font-style: italic; }
    .agent-output-meta { margin: 4px 0 8px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: rgba(59, 66, 80, 0.8); }
    .agent-output pre {
      margin: 0; max-height: 52vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
      font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.45;
      background: #faf6ec; border: 1px solid rgba(124, 92, 62, 0.35); border-radius: 4px; padding: 8px 10px;
    }
    .conditions { border-top: 1px solid rgba(59, 66, 80, 0.2); padding-top: 6px; line-height: 1.5; }
    .agent-log {
      list-style: none; margin: 6px 0 0; padding: 6px 0 0; max-height: 160px; overflow-y: auto;
      border-top: 1px solid rgba(59, 66, 80, 0.2);
      font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.5;
    }
    .agent-log time { color: rgba(59, 66, 80, 0.6); margin-right: 4px; }

    .maplibregl-popup.hover-label .maplibregl-popup-content {
      padding: 3px 8px; font-family: Georgia, serif; font-size: 13px;
      background: rgba(243, 237, 224, 0.95); color: var(--slate);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="spoken-banner" class="spoken-banner" hidden></div>

  <!-- Crash check-in: a large countdown ring, with the demo reply buttons (no microphone this round). -->
  <div id="checkin" class="checkin" hidden>
    <svg viewBox="0 0 140 140" class="checkin-ring" aria-hidden="true">
      <circle cx="70" cy="70" r="60" class="ring-track"/>
      <circle cx="70" cy="70" r="60" class="ring-fill" id="ring-fill"/>
    </svg>
    <div class="checkin-count" id="checkin-count">30</div>
    <div class="checkin-title" id="checkin-title">Are you okay?</div>
    <div class="checkin-buttons">
      <button type="button" data-said="okay">Skier says: I'm okay</button>
      <button type="button" data-said="help">Skier says: help</button>
    </div>
  </div>

  <!-- Patrol view: SIMULATED. Incident cards for this session; no real patrol or 911 is contacted. -->
  <aside id="patrol-panel" class="patrol-panel" aria-label="Simulated patrol console">
    <header>
      <h2>Patrol console</h2>
      <p class="simulated">Simulated: no real patrol is contacted</p>
      <button type="button" id="incident-live-run" title="Runs the real Incident Responder on Creao (spends credits)">Live Incident Responder run</button>
    </header>
    <p id="patrol-empty" class="patrol-empty">No incidents. A check-in that escalates appears here.</p>
    <div id="incident-cards"></div>
  </aside>
  <div class="layer-toggle">
    <label><input type="checkbox" data-group="runs" checked> Runs</label>
    <label><input type="checkbox" data-group="lifts"> Lifts</label>
    <label><input type="checkbox" data-group="hazards" checked> Hazards</label>
    <div class="replay">
      Replay
      <button type="button" data-scenario="scenario_1">Scenario 1</button>
      <button type="button" data-scenario="scenario_2">Scenario 2</button>
      <button type="button" data-scenario="scenario_3">Scenario 3</button>
      <button type="button" data-scenario="scenario_4">Scenario 4</button>
      <button type="button" data-scenario="scenario_4b">Scenario 4b</button>
    </div>
    <div class="view-toggle">
      View
      <button type="button" data-view="skier" class="playing">Skier</button>
      <button type="button" data-view="patrol">Patrol</button>
    </div>
    <div class="replay-speed">
      Speed
      <button type="button" data-speed="1" class="playing">1x</button>
      <button type="button" data-speed="2">2x</button>
      <button type="button" data-speed="4">4x</button>
      <span id="playback-speed" class="playback-speed"></span>
    </div>
  </div>
  <div class="agents-panel">
    <div class="agents-header"><span>Today on the mountain</span></div>
    <div id="conditions" class="conditions"></div>
    <ul id="agent-log" class="agent-log"></ul>
  </div>

  <!-- Agent org chart: Maia founds it, the Creao chain runs top to bottom, Incident Responder
       stands by off to the side. Boxes light up while their agent runs; click for the last output. -->
  <section class="org-card" id="org-card" aria-label="Cairn agent org chart">
    <header class="org-header">
      <h2>The Cairn crew</h2>
      <span class="org-header-buttons">
        <button type="button" id="run-agents">Run agents</button>
        <button type="button" id="org-toggle" aria-expanded="true" aria-controls="org-content" title="Collapse">▾</button>
      </span>
    </header>
    <div id="org-content">
      <div class="org-chart">
        <div class="org-box founder"><b>Maia</b><span class="org-role">founder</span></div>
        <div class="org-body">
          <div class="org-col org-chain">
            <button type="button" class="org-box creao" data-role="conditions"><span class="org-dot"></span><b>Conditions Analyst</b><span class="org-role">weather, avalanche, closures</span><span class="org-run"></span></button>
            <div class="org-arrow">↓</div>
            <button type="button" class="org-box creao" data-role="terrain"><span class="org-dot"></span><b>Terrain Scout</b><span class="org-role">today's zones, briefings</span><span class="org-run"></span></button>
            <div class="org-arrow">↓</div>
            <button type="button" class="org-box creao" data-role="route"><span class="org-dot"></span><b>Route Planner</b><span class="org-role">lines through each bowl</span><span class="org-run"></span></button>
          </div>
          <div class="org-col org-side">
            <button type="button" class="org-box creao standby" data-role="incident"><span class="org-dot"></span><b>Incident Responder</b><span class="org-role">on standby for patrol</span><span class="org-run"></span></button>
          </div>
          <div class="org-col org-chain">
            <button type="button" class="org-box code" data-code="geofence"><span class="org-dot"></span><b>Geofence</b><span class="org-role">smooths GPS, checks zones</span><span class="org-run"></span></button>
            <div class="org-arrow">↓</div>
            <button type="button" class="org-box code" data-code="coordinator"><span class="org-dot"></span><b>Coordinator (Claude)</b><span class="org-role">words each spoken line</span><span class="org-run"></span></button>
            <div class="org-arrow">↓</div>
            <button type="button" class="org-box code" data-code="voice"><span class="org-dot"></span><b>Voice (Sonic)</b><span class="org-role">chime, then speech</span><span class="org-run"></span></button>
          </div>
        </div>
      </div>
      <p class="org-legend"><span class="org-dot creao-dot"></span> Creao agents <span class="org-dot code-dot"></span> our code</p>
    </div>
  </section>

  <dialog id="agent-output" class="agent-output">
    <header><h3 id="agent-output-title"></h3><button type="button" id="agent-output-close" aria-label="Close">×</button></header>
    <p id="agent-output-meta" class="agent-output-meta"></p>
    <pre id="agent-output-body"></pre>
  </dialog>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
